name: CI

on:
  push:
    branches-ignore:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        i: [4, 0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test
        run: make test
      - name: Make dir for artifact
        run: mkdir -p artifact
      - name: Show IP
        run: curl -s https://httpbin.org/ip
      - name: Run scraper
        run: ./update.sh
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: "AKIATTWUTKSTQ2RLDQGQ"
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: "cbosa-648@jawne.info.pl"
          SMTP_TO: "dry-run"
          MODE: "${{ matrix.i }}"
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "Update by GitHub Action" *.json || echo "Nothing to update"
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.i }}
          path: artifact
      - name: Show Proxy logs
        run: make logs
        if: failure()
